{% extends "auth_base.html" %}
{% block title %}Verify code{% endblock %}
{% block subtitle %}Enter the code sent to your registered email{% endblock %}

{% block card %}
<form method="post" action="{{ url_for('verify_otp') }}">
  <div class="login-field">
    <label for="otp-code">6-digit code</label>
    <div class="input-wrap">
      <input id="otp-code" class="otp-input" name="otp" type="text" maxlength="6"
             inputmode="numeric" pattern="[0-9]{6}" placeholder="------"
             autocomplete="one-time-code" required autofocus>
    </div>
  </div>

  <button class="primary" type="submit">Verify and continue</button>
</form>

<p class="security-note">
  <span class="security-icon" aria-hidden="true">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 3l8 3v5c0 5-3.4 8.5-8 10-4.6-1.5-8-5-8-10V6l8-3z"></path>
      <path d="M9 12l2 2 4-4"></path>
    </svg>
  </span>
  <span>Signing in as <strong>{{ emp_id }}</strong>. The code is valid for this sign-in only.</span>
</p>

<a class="back-link" href="{{ url_for('login') }}">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <line x1="19" y1="12" x2="5" y2="12"></line><polyline points="11 18 5 12 11 6"></polyline>
  </svg>
  Use a different employee ID
</a>
{% endblock %}
